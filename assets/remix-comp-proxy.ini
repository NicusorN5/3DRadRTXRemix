; remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering

[Launch]
; Editor-only (3DRad.exe). The launch dialog still appears every editor start;
; this is the radio that is preselected. Enter = Launch (default Remix).
; remix = RTX Remix bridge (d3d9_remix.dll) + FFP/camera/lights
; dx9   = stock Direct3D9 (no Remix, DXVK, FFP, or game hooks)
; dxvk  = vanilla DXVK (d3d9_dxvk.dll next to the proxy — never overwrites d3d9.dll)
Backend=remix

[Video]
; Editor-only. Shown 3D viewport / Remix MAIN via SetViewport inject.
; MatchWindow=1 follows ChildClass (default). No D3D Reset.
; Width/Height 0 = follow window. Scale is percent of ChildClass client.
MatchWindow=1
Width=0
Height=0
Scale=100

[UI]
; Editor-only. Scale is percent (50-200) for system\ui widgets / buttons.dds.
; FontSize/FontName apply WM_SETFONT to the MFC object list (not ChildClass).
; ListWidth/RowHeight/CheckSize 0 = stock object-list metrics.
; ShowObjectIds=1 keeps the engine's 5-digit prefix (00032Particles).
; ShowObjectIds=0 draws the type/name only on individual object rows.
; ColorSelected0/1 ColorUnselected0/1 ColorGroup0/1 ColorHidden0/1 = R,G,B
; vertical-gradient stops for object-list rows (Settings - UI color wheels).
Scale=100
HudScale=100
FontSize=13
FontName=Segoe UI
ListWidth=0
RowHeight=0
CheckSize=0
ShowObjectIds=1
ColorSelected0=138,28,28
ColorSelected1=196,56,56
ColorUnselected0=18,18,20
ColorUnselected1=40,40,44
ColorGroup0=224,144,50
ColorGroup1=187,115,29
ColorHidden0=12,12,14
ColorHidden1=26,26,30

[Remix]
Enabled=1
DLLName=d3d9_remix.dll
; 3DRad_compiler.exe is auto-detected and never loads this bridge.

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
; ============================================================
; ============================================================
; World-space camera position
;
; 3Impact stores the editor/player eye in iCameraLocation (camera+0x50)
; but builds a camera-relative view (LookAtLH eye at the origin). Remix
; then reports Position 0,0,0. Set this to 1 to read the shown camera's
; world location and put it into D3DTS_VIEW, adding it back to worlds
; so World*View stays the same.
; ============================================================
[Camera]
WorldSpacePosition=1

[Skinning]
Enabled=0

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
DelayMs=50000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
